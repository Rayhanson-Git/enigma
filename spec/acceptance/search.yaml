  - {id: SC-01, then: "entry with last_embed.at after the note mtime -> {vec: [0.1,0.2,0.3], fresh: true}; before -> fresh false"}
  - {id: SC-02, then: "duplicate key in one file: the later line wins"}
  - {id: SC-03, then: "no .smart-env directory -> {}"}
  - {id: SC-04, then: "smart_blocks:* keys ignored; only Daily.md listed"}
