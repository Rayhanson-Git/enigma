  - {id: HY-01, given: "Contractors.md 'Outstanding invoices from contractors need review.\n'", when: "query 'who do I owe money to' (semantic embedder)", then: "Contractors.md is in the hits although no token is shared"}
  - {id: HY-02, then: "rrf_fuse([[x,y,z],[y,x,z]]) puts x or y first and z last; rrf_fuse([[x],[]]) == [x]; rrf_fuse([[],[]]) == []"}
  - {id: HY-03, given: "Freight.md 'This note is about supply chain freight operations.'", when: "query 'freight'", then: "Freight.md in hits"}
  - {id: HY-04, when: "query 'e' with tags [grid]", then: "exactly [Projects/Lighthouse Grid.md] (substring fallback because 'e' yields no BM25 hit)"}
