  - {id: BM-02, given: "{a.md: 'the lighthouse grid pipeline ingests outage data', b.md: 'an unrelated note about weather patterns'}", when: "rank 'lighthouse pipeline'", then: "[a.md] only"}
  - {id: BM-03, given: "{common.md: 'the the the the the project project', rare.md: 'zephyr appears exactly once here'}", when: "rank 'zephyr'", then: "first is rare.md"}
  - {id: BM-04, then: "empty corpus -> []; unknown term -> []"}
  - {id: BM-05, then: "10 identical docs, limit 3 -> 3 results"}
  - {id: BM-06, then: "a long note repeating 'varroa' 400 times ranks below the short note titled 'Varroa Mites' for the query 'varroa mites'; a note is found by a title word its text never uses"}
