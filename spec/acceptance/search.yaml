# Part 3: vectors. Fake embedder [len(text), 0].
  - {id: EM-01, given: "fresh Smart Connections vector [1,2] for Daily.md and fresh vectors for every other note", then: "Daily.md vector is [1,2]; the embedder is never called"}
  - {id: EM-02, given: "Smart Connections vector older than the note", then: "fallback vector used; embedder called"}
  - {id: EM-03, then: "no Smart Connections data -> every note embedded locally; second call embeds nothing (cache hit)"}
  - {id: EM-04, then: "after warming the cache, stale list is []; editing Daily.md -> ['Daily.md']; computing the stale list never creates fallback_embeddings.json"}
  - {id: EM-05, then: "cache memo returns on-disk content; an out-of-process rewrite with a new mtime is picked up; a corrupt file loads as {}; mutating a loaded map does not change what the next load returns"}
  - {id: EM-06, given: "atomic replace fails with a lock error", then: "error surfaces; only the old cache file remains (no temp file); old content still loads"}
  - {id: EM-07, then: "persist=false returns vectors and writes no cache file"}
