  - {id: SE-06, then: "body_text('---\ntags: [x]\n---\n\n# T\n\nBody.\n') == '\n\n# T\n\nBody.\n'; no frontmatter -> unchanged; unclosed fence -> unchanged"}

# Part 2: hybrid search. Keyword fake embedder: vector = [has "freight", has "baking", has "budget"] (1.0/0.0 per word).
