  - {id: VA-18, given: "publishing (link or rename) fails twice with a lock error (POSIX: EACCES; Windows: access denied)", then: "third attempt succeeds (both create-only and overwrite paths)"}
  - {id: VA-19, given: "publishing always fails with a lock error (POSIX: EACCES; Windows: access denied)", then: "the lock error surfaces as IoError after 5 attempts"}
