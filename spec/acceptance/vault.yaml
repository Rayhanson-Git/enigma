# Acceptance: vault access layer (spec/03-vault-rules.md). Fixture: mini vault (MV).
cases:
  - {id: VA-01, when: "open a vault at a path that does not exist", then: "error containing 'does not exist'"}
  - {id: VA-02, when: "read Daily.md", then: "text contains 'Remember to check'"}
  - {id: VA-03, when: "read Ghost.md", then: "error containing 'not found'"}
  - {id: VA-04, when: "read ../outside.md", then: "error containing 'escapes'"}
