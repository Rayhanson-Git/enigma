  - {id: VA-22, given: "deleting the temp file after a successful publish fails", then: "the write still reports success"}
  - {id: VA-23, given: "opening for append fails twice with a lock error", then: "third succeeds; content '- captured\n'"}
  - {id: VA-24, given: "opening for append always fails", then: "lock error surfaces"}
  - {id: VA-25, given: "the append write fails after writing half the bytes", then: "error surfaces, no retry; file contains exactly the first half ('- cap')"}
