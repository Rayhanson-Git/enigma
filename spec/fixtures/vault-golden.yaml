# Golden queries for the fixture vault in spec/fixtures/vault/ (29 notes).
# Format: spec/13-evals.md (id, query, expect, accept, tags, folder, note).
# Paths are vault-relative with "/" separators; every path exists (EV-09).
#
# How the expectations were reasoned (BM25 lane = BM25L over the full raw
# note text, tokens are lowercase ASCII [a-z0-9]+; fusion = RRF k=60):
# - When the target is the ONLY note with a BM25 score > 0 for the query, it
#   is rank 1 whatever the embedder does: its fused score is at least
#   1/61 + 1/(60+v), and every other note can reach at most 1/61 (vector
#   lane only). Those rows are marked "sole BM25 hit".
# - When other notes also score, the target leads BM25 by a wide margin;
#   the runner-ups that a strong vector rank could lift above it are listed
#   under accept, so the row still scores rank 1.
# - substr-kanji has no ASCII tokens, so BM25 is empty and the substring
#   fallback lane decides; the target is the only note containing the text.
# - para-query shares no token with any note in the vault, so BM25 and the
#   substring lane are both empty and the result is pure vector ranking
#   (bge-micro-v2, mean pooling, raw text including frontmatter).
#
# BM25 standings (score, rounded) were computed on these exact notes and are
# given in each note field.

