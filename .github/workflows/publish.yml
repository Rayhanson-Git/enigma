name: Publish

# Runs when a GitHub release is published: puts that version on crates.io and
# on the Official MCP Registry. Both sign in with GitHub's OIDC token, so no
# publishing secret is stored in this repository.
# Run it by hand (Actions > Publish > Run workflow) for a dry run that
# publishes nothing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC sign-in to crates.io and the MCP Registry
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      DRY_RUN: ${{ github.event_name != 'release' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Check the release tag matches Cargo.toml
        id: version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$DRY_RUN" = "false" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A re-run after a partial failure skips what is already published.
      - name: Is this version already on crates.io?
        id: crate
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "enigma-mcp publish workflow" \
            "https://crates.io/api/v1/crates/enigma-mcp/${{ steps.version.outputs.version }}")
          echo "exists=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Sign in to crates.io
        if: env.DRY_RUN == 'false' && steps.crate.outputs.exists == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        if: env.DRY_RUN == 'true' || steps.crate.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then cargo publish --dry-run; else cargo publish; fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Set the version in server.json
        run: |
          v="${{ steps.version.outputs.version }}"
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          ./mcp-publisher validate server.json

      - name: Publish to the MCP Registry
        if: env.DRY_RUN == 'false'
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          if curl -sf "https://registry.modelcontextprotocol.io/v0/servers/io.github.Rayhanson-Git%2Fenigma/versions/$v" > /dev/null; then
            echo "Version $v is already in the MCP Registry"
            exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
