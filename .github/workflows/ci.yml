name: CI

on:
  push:
    branches: [main, windows]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The tests run the real embedding model; fetch it before going offline.
      - name: Fetch the embedding model
        env:
          HF_HUB_OFFLINE: "0"
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" -m pip install --user --break-system-packages -U huggingface_hub
          "$PY" -c "from huggingface_hub import snapshot_download; snapshot_download('TaylorAI/bge-micro-v2', allow_patterns=['config.json', 'tokenizer.json', 'model.safetensors'])"
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast
      - run: cargo build --release
